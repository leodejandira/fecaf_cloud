name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  KUSTOMIZE_VERSION: "5.7.1"
  KUBECONFORM_VERSION: "0.7.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.6
      - run: ruff check .
      - run: ruff format --check .
      - name: hadolint
        run: |
          for f in services/*/Dockerfile; do
            echo "$f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < "$f"
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, pedidos, pagamentos, estoque]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --junitxml=resultado-testes.xml
        env:
          TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/postgres
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testes-${{ matrix.service }}
          path: services/${{ matrix.service }}/resultado-testes.xml

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: instalar kustomize e kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
      - name: validar overlays
        run: |
          for o in staging prod; do
            for f in k8s/overlays/$o/*.env.example; do cp "$f" "${f%.example}"; done
            kustomize build "k8s/overlays/$o" | kubeconform -strict -summary -kubernetes-version 1.33.0 -ignore-missing-schemas
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate
        run: |
          for env in staging prod; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done

  build:
    if: github.event_name == 'push'
    needs: [lint, test, manifests, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, pedidos, pagamentos, estoque]
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pedidos-veloz-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest-main,enable={{is_default_branch}}
      - name: build local para scan
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:scan
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: scan de vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: publicar
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          provenance: true
          sbom: true

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - name: instalar kustomize
        run: curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
      - name: kubeconfig e secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          PEDIDOS_DATABASE_URL: ${{ secrets.PEDIDOS_DATABASE_URL }}
          ESTOQUE_DATABASE_URL: ${{ secrets.ESTOQUE_DATABASE_URL }}
          PROVEDOR_TOKEN: ${{ secrets.PROVEDOR_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PEDIDOS_DB_PASSWORD: ${{ secrets.PEDIDOS_DB_PASSWORD }}
          ESTOQUE_DB_PASSWORD: ${{ secrets.ESTOQUE_DB_PASSWORD }}
        run: |
          mkdir -p ~/.kube && echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
          umask 077
          printf 'PEDIDOS_DATABASE_URL=%s\nESTOQUE_DATABASE_URL=%s\nPROVEDOR_TOKEN=%s\n' \
            "$PEDIDOS_DATABASE_URL" "$ESTOQUE_DATABASE_URL" "$PROVEDOR_TOKEN" > k8s/overlays/staging/secrets.env
          printf 'POSTGRES_PASSWORD=%s\nPEDIDOS_DB_PASSWORD=%s\nESTOQUE_DB_PASSWORD=%s\n' \
            "$POSTGRES_PASSWORD" "$PEDIDOS_DB_PASSWORD" "$ESTOQUE_DB_PASSWORD" > k8s/overlays/staging/postgres.env
      - name: deploy
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" ./scripts/deploy.sh staging "sha-${GITHUB_SHA::7}"

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.lojaveloz.com.br
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - name: instalar kustomize
        run: curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
      - name: kubeconfig e secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          PEDIDOS_DATABASE_URL: ${{ secrets.PEDIDOS_DATABASE_URL }}
          ESTOQUE_DATABASE_URL: ${{ secrets.ESTOQUE_DATABASE_URL }}
          PROVEDOR_TOKEN: ${{ secrets.PROVEDOR_TOKEN }}
        run: |
          mkdir -p ~/.kube && echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
          umask 077
          printf 'PEDIDOS_DATABASE_URL=%s\nESTOQUE_DATABASE_URL=%s\nPROVEDOR_TOKEN=%s\n' \
            "$PEDIDOS_DATABASE_URL" "$ESTOQUE_DATABASE_URL" "$PROVEDOR_TOKEN" > k8s/overlays/prod/secrets.env
      - name: deploy
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" ./scripts/deploy.sh prod "${GITHUB_REF_NAME#v}"

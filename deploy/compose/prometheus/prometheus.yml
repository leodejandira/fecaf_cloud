global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: pedidos-veloz
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels: { app: gateway }
      - targets: ["pedidos:8000"]
        labels: { app: pedidos }
      - targets: ["pagamentos:8000"]
        labels: { app: pagamentos }
      - targets: ["estoque:8000"]
        labels: { app: estoque }

name: pedidos-veloz

x-telemetria: &telemetria
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  APP_ENV: local
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-healthcheck: &healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  gateway:
    build:
      context: ./services/gateway
      args:
        VERSION: ${TAG:-dev}
    image: ${REGISTRY:-pedidos-veloz}/gateway:${TAG:-dev}
    environment:
      <<: *telemetria
      PEDIDOS_URL: http://pedidos:8000
      ESTOQUE_URL: http://estoque:8000
    ports:
      - "8080:8000"
    depends_on:
      pedidos:
        condition: service_healthy
      estoque:
        condition: service_healthy
    healthcheck: *healthcheck
    networks: [frontend, backend, observabilidade]
    restart: unless-stopped

  pedidos:
    build:
      context: ./services/pedidos
      args:
        VERSION: ${TAG:-dev}
    image: ${REGISTRY:-pedidos-veloz}/pedidos:${TAG:-dev}
    environment:
      <<: *telemetria
      DATABASE_URL: postgresql://pedidos:${PEDIDOS_DB_PASSWORD:-pedidos-local}@postgres:5432/pedidos
      ESTOQUE_URL: http://estoque:8000
      PAGAMENTOS_URL: http://pagamentos:8000
    depends_on:
      postgres:
        condition: service_healthy
      estoque:
        condition: service_healthy
      pagamentos:
        condition: service_healthy
    healthcheck: *healthcheck
    networks: [backend, dados, observabilidade]
    restart: unless-stopped

  pagamentos:
    build:
      context: ./services/pagamentos
      args:
        VERSION: ${TAG:-dev}
    image: ${REGISTRY:-pedidos-veloz}/pagamentos:${TAG:-dev}
    environment:
      <<: *telemetria
      LIMITE_APROVACAO: "5000"
      LATENCIA_SIMULADA_MS: "120"
      PROVEDOR_URL: ${PROVEDOR_URL:-}
      PROVEDOR_TOKEN: ${PROVEDOR_TOKEN:-}
    healthcheck: *healthcheck
    networks: [backend, observabilidade]
    restart: unless-stopped

  estoque:
    build:
      context: ./services/estoque
      args:
        VERSION: ${TAG:-dev}
    image: ${REGISTRY:-pedidos-veloz}/estoque:${TAG:-dev}
    environment:
      <<: *telemetria
      DATABASE_URL: postgresql://estoque:${ESTOQUE_DB_PASSWORD:-estoque-local}@postgres:5432/estoque
      SEED_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *healthcheck
    networks: [backend, dados, observabilidade]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD:-pedidos-local}
      ESTOQUE_DB_PASSWORD: ${ESTOQUE_DB_PASSWORD:-estoque-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [dados]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.140.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/compose/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]
    networks: [observabilidade]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.12.0
    ports:
      - "16686:16686"
    networks: [observabilidade]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.8.0
    volumes:
      - ./deploy/compose/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    networks: [observabilidade]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, jaeger]
    networks: [observabilidade]
    restart: unless-stopped

networks:
  frontend:
  backend:
  dados:
    internal: true
  observabilidade:

volumes:
  pgdata:
  promdata:
